
name: Rebuild APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify Decompiled Project
        run: |
          if [ ! -f apktool.yml ]; then
            echo "ERROR: apktool.yml not found in repository root!"
            exit 1
          fi

          if [ ! -f AndroidManifest.xml ]; then
            echo "ERROR: AndroidManifest.xml not found!"
            exit 1
          fi

          echo "Decompiled project verified!"

      - name: Install APKTool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool

      - name: Rebuild APK
        run: |
          mkdir -p build-output

          apktool b . \
            -o build-output/app-unsigned.apk \
            -f

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Build Tools
        run: |
          sdkmanager "build-tools;35.0.0"

      - name: Align APK
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/zipalign" \
            -p -f 4 \
            build-output/app-unsigned.apk \
            build-output/app-aligned.apk

      - name: Generate Debug Keystore
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Sign APK
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out build-output/app-debug.apk \
            build-output/app-aligned.apk

      - name: Verify APK Signature
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            build-output/app-debug.apk

      - name: Upload Rebuilt APK
        uses: actions/upload-artifact@v4
        with:
          name: REBUILT-APK
          path: build-output/app-debug.apk
          retention-days: 7
