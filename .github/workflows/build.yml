
name: Rebuild APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify Decompiled Project
        run: |
          test -f apktool.yml || {
            echo "ERROR: apktool.yml missing"
            exit 1
          }

          test -f AndroidManifest.xml || {
            echo "ERROR: AndroidManifest.xml missing"
            exit 1
          }

          test -d res || {
            echo "ERROR: res folder missing"
            exit 1
          }

          echo "Project verified."

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android Build Tools
        uses: android-actions/setup-android@v3

      - name: Install Build Tools 35
        run: |
          sdkmanager "build-tools;35.0.0"

      - name: Install Latest Apktool
        run: |
          VERSION="3.0.3"

          curl -fL \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${VERSION}/apktool_${VERSION}.jar" \
            -o "$RUNNER_TEMP/apktool.jar"

          cat > "$RUNNER_TEMP/apktool" <<'EOF'
          #!/bin/sh
          exec java -jar "$RUNNER_TEMP/apktool.jar" "$@"
          EOF

          chmod +x "$RUNNER_TEMP/apktool"

          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

          java -jar "$RUNNER_TEMP/apktool.jar" --version

      - name: Inspect Resource Filenames
        run: |
          echo "Checking invalid Android resource names..."

          find res -type f | while IFS= read -r file; do
            name=$(basename "$file")

            if [[ ! "$name" =~ ^[a-z0-9_.]+$ ]]; then
              echo "Invalid resource: $file"
            fi
          done

      - name: Rebuild APK
        run: |
          mkdir -p build-output

          apktool b . \
            -o build-output/app-unsigned.apk \
            -f

      - name: Align APK
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/zipalign" \
            -p -f 4 \
            build-output/app-unsigned.apk \
            build-output/app-aligned.apk

      - name: Generate Debug Keystore
        run: |
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Sign APK
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out build-output/app-debug.apk \
            build-output/app-aligned.apk

      - name: Verify APK
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            build-output/app-debug.apk

          file build-output/app-debug.apk

      - name: Upload Rebuilt APK
        uses: actions/upload-artifact@v4
        with:
          name: REBUILT-APK
          path: build-output/app-debug.apk
          retention-days: 7
