
name: APK Decompile

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct APK download URL"
        required: true
        type: string
        default: "https://tgfile2link-senpaii-v10.vercel.app/1245/BQACAgUAAxkBAAIC0GrtNbLbNXGZ7i2uSVqaqs4rwAeoAAK_IgAC9tlpVjETKPKFKShcPQQ"

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Setup workspace
        run: |
          mkdir -p output/decompiled

      - name: Install APKTool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool zip unzip

      - name: Download APK
        env:
          APK_URL: ${{ inputs.apk_url }}
        run: |
          curl -fL --retry 3 \
            "$APK_URL" \
            -o output/app.apk

      - name: Verify APK
        run: |
          file output/app.apk
          unzip -t output/app.apk

      - name: Decompile APK
        run: |
          apktool d output/app.apk \
            -o output/decompiled \
            -f

      - name: Create ZIP
        run: |
          cd output
          zip -qr ../APK-OUTPUT.zip decompiled/

      - name: Upload ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK-DECOMPILED-OUTPUT
          path: APK-OUTPUT.zip
          retention-days: 7
