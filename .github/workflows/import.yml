
name: Import Decompiled Files to Root

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Decompile workflow Run ID"
        required: true
        type: string
        default: "42151163725"

permissions:
  actions: read
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download ZIP Artifact
        uses: actions/download-artifact@v4
        with:
          name: APK-DECOMPILED-OUTPUT
          path: artifact
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract ZIP
        run: |
          mkdir -p extracted

          ZIP_FILE=$(find artifact -name "APK-OUTPUT.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP not found!"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d extracted

          if [ ! -d extracted/decompiled ]; then
            echo "Decompiled folder missing!"
            exit 1
          fi

      - name: Remove Old Decompiled Folder
        run: |
          rm -rf decompiled

      - name: Copy All Files to Repository Root
        run: |
          cp -a extracted/decompiled/. .

          echo "Root files:"
          ls -la

      - name: Remove Temporary Files
        run: |
          rm -rf extracted artifact

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Import decompiled files into repository root"
            git push origin main
          fi
